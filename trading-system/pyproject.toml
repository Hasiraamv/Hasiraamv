[project]
name = "trading-system"
version = "0.1.0"
description = "Crypto research + backtest + PAPER-TRADING system. Paper trading only — never places live orders."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "sqlmodel>=0.0.21",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "ccxt>=4.3",
  "polars>=1.0",
  "pandas>=2.2",
  "duckdb>=1.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "prometheus-client>=0.20",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "openai>=1.30",
  "tenacity>=8.3",
]

[project.optional-dependencies]
ml = [
  "lightgbm>=4.3",
  "xgboost>=2.0",
  "scikit-learn>=1.4",
  "mlflow>=2.13",
]
portfolio = [
  "riskfolio-lib>=6.0",
  "pyportfolioopt>=1.5",
  "cvxpy>=1.5",
]
backtest = [
  "vectorbt>=0.26",
  "backtrader>=1.9",
]
agent = [
  "langgraph>=0.1",
  "langchain-openai>=0.1",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]
full = [
  "trading-system[ml,portfolio,backtest,agent,dev]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
