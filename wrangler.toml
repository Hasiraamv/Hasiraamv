name = "rarehaus"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Deploying to the pocket37 domain replaces whatever that Worker currently serves.
# Set the route only when you are ready for that switchover.
# routes = [{ pattern = "pocket37.com/*", zone_name = "pocket37.com" }]

[[d1_databases]]
binding = "DB"
# database_name stays "mintmark" deliberately -- it must match the D1 database's actual
# registered name in the Cloudflare account (its real identity is database_id below, which
# is unchanged), not the Worker's own name. Renaming the D1 resource itself is a separate,
# unnecessary step: it is never shown to a customer.
database_name = "mintmark"
database_id = "8932b638-5ed4-4173-9fe3-c27c5203954c"

# Product photo storage. Uncomment once R2 is enabled in the dashboard and the bucket exists,
# otherwise `wrangler deploy` fails because the bucket cannot be found.
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "rarehaus-images"

# Renaming the Worker's technical name (top of this file) from "mintmark" to "rarehaus" makes
# `wrangler deploy` create a NEW Worker script called "rarehaus" -- Cloudflare treats a name
# change as a new Worker, not an in-place rename. Before deploying this:
#   1. Run `wrangler secret put ADMIN_PASSWORD` and `wrangler secret put SESSION_SECRET` again
#      -- secrets belong to the old "mintmark" Worker and do NOT carry over automatically.
#      Skipping this breaks admin login and cart/cookie signing on the new Worker.
#   2. After deploying, go to Cloudflare dashboard -> Workers & Pages -> rarehaus -> Settings
#      -> Domains & Routes -> Add Custom Domain -> rarehaus.in. Adding it here automatically
#      removes it from the old "mintmark" Worker (a domain can only route to one Worker).
#   3. Once rarehaus.in is confirmed serving from the new Worker, the old "mintmark" Worker can
#      be deleted from the dashboard -- it will keep serving the fallback
#      mintmark.rehanhussain859.workers.dev URL until then, which is harmless to leave running.
[vars]
SITE_NAME = "Rarehaus"
SITE_URL = "https://rarehaus.in"
CURRENCY = "INR"

# DEMO_MODE shows a banner saying the catalogue is sample data and no orders are fulfilled.
# Turned off at the owner's explicit request. NOTE: the catalogue in db/seed.sql is still
# placeholder stock and checkout still has no payment gateway wired (see README "Before
# taking real money") -- turning this off removes the disclaimer, it does not by itself
# make the shop truthful or able to take money. Replace the catalogue and wire Razorpay
# before actually announcing the site publicly.
DEMO_MODE = "false"

# Business details. These appear in your policies, footer and contact page. Every page that
# needs them reads from here, so fill them in once. Leaving a value blank shows a visible
# placeholder rather than silently omitting a legally required detail.
LEGAL_NAME = "Rarehaus"
REGISTERED_ADDRESS = "Bishnu Rabha Path, Guwahati, Assam 781026, India"
SUPPORT_EMAIL = "customer@rarehaus.in"
SUPPORT_WHATSAPP = "+91 93959 62006"
GSTIN = ""
CIN = ""
GRIEVANCE_OFFICER = "Rehan Hussain"
GRIEVANCE_EMAIL = "customer@rarehaus.in"
GRIEVANCE_PHONE = "+91 93959 62006"
JURISDICTION_CITY = "Guwahati"

# Secrets (set with `wrangler secret put <NAME>`, never commit them):
#   ADMIN_PASSWORD   password for /admin
#   SESSION_SECRET   random string used to sign admin and cart cookies
