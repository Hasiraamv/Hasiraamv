name = "fitpocket"
main = "src/index.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

# Custom domain routing. `fitpocket.in` (the zone) must already be active in
# this Cloudflare account (added under Websites) for this to take effect —
# `wrangler deploy` creates/updates the route automatically, no dashboard
# click-ops needed once the zone exists.
#
# api.fitpocket.in -> this Worker (the backend). The root domain is left free
# for the frontend (a separate Pages/Worker deployment) so the two don't
# collide on the same hostname.
routes = [
  { pattern = "api.fitpocket.in/*", zone_name = "fitpocket.in" }
]

# If you'd rather serve everything (frontend + /api/*) from this same Worker
# instead of a separate frontend deployment, replace the route above with:
# routes = [
#   { pattern = "fitpocket.in/*", zone_name = "fitpocket.in" }
# ]
# and have this Worker also serve static assets (see Cloudflare's Workers
# Assets / Static Assets docs) alongside the /api routes already defined.

[[d1_databases]]
binding = "DB"
database_name = "fitpocket-db"
database_id = "ed9b8523-d6ce-4c6a-8b8d-696c23b7a227"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "development"
# Not sensitive (it's public in every Google sign-in request from the browser
# anyway) so it lives here as a var rather than a secret. Get this from
# Google Cloud Console > APIs & Services > Credentials > OAuth 2.0 Client ID.
GOOGLE_CLIENT_ID = "REPLACE_WITH_YOUR_GOOGLE_OAUTH_CLIENT_ID"

# Password-reset emails are sent via Resend (https://resend.com — free tier
# is plenty for this volume). Sign up, then:
#   wrangler secret put RESEND_API_KEY
# Using Resend's shared test sender for now since fitpocket.in isn't verified
# as a sending domain yet — switch to "FitPocket <noreply@fitpocket.in>" once
# it is (Resend dashboard -> Domains -> Add Domain -> add the DNS records to
# Cloudflare -> wait for "Verified").
FROM_EMAIL = "FitPocket <onboarding@resend.dev>"
FRONTEND_URL = "https://fitpocket.in"

# Set the real secret with: wrangler secret put JWT_SECRET
