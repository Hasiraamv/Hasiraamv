name = "rarehaus"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Deploying to the pocket37 domain replaces whatever that Worker currently serves.
# Set the route only when you are ready for that switchover.
# routes = [{ pattern = "pocket37.com/*", zone_name = "pocket37.com" }]

[[d1_databases]]
binding = "DB"
# database_name stays "mintmark" deliberately -- it must match the D1 database's actual
# registered name in the Cloudflare account (its real identity is database_id below, which
# is unchanged), not the Worker's own name. Renaming the D1 resource itself is a separate,
# unnecessary step: it is never shown to a customer.
database_name = "mintmark"
database_id = "8932b638-5ed4-4173-9fe3-c27c5203954c"

# Product photo storage, free tier, no payment method required: KV is on the Workers free
# plan (1 GB, 100k reads/day), which is far more than a shop this size needs for photos.
# Uploading from the admin panel works off this binding alone.
[[kv_namespaces]]
binding = "IMAGES_KV"
id = "61f557640dc14e97a45909d00fc8258c"

# R2 is the better home for photos at volume, and the only option for video (a KV value
# tops out at 25 MB). It needs R2 enabled in the dashboard, which asks for a card even
# though the free tier covers this shop. Uncomment once that is done and the bucket exists;
# images already uploaded to KV keep serving either way.
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "rarehaus-images"

# Renaming the Worker's technical name (top of this file) from "mintmark" to "rarehaus" makes
# `wrangler deploy` create a NEW Worker script called "rarehaus" -- Cloudflare treats a name
# change as a new Worker, not an in-place rename. Before deploying this:
#   1. Run `wrangler secret put ADMIN_PASSWORD` and `wrangler secret put SESSION_SECRET` again
#      -- secrets belong to the old "mintmark" Worker and do NOT carry over automatically.
#      Skipping this breaks admin login and cart/cookie signing on the new Worker.
#   2. After deploying, go to Cloudflare dashboard -> Workers & Pages -> rarehaus -> Settings
#      -> Domains & Routes -> Add Custom Domain -> rarehaus.in. Adding it here automatically
#      removes it from the old "mintmark" Worker (a domain can only route to one Worker).
#   3. Once rarehaus.in is confirmed serving from the new Worker, the old "mintmark" Worker can
#      be deleted from the dashboard -- it will keep serving the fallback
#      mintmark.rehanhussain859.workers.dev URL until then, which is harmless to leave running.
[vars]
SITE_NAME = "Rarehaus"
SITE_URL = "https://rarehaus.in"
CURRENCY = "INR"

# Orders at or above this land on the Orders page with a review flag instead of shipping
# silently -- see src/risk.js for the other signals (first-time buyer, several orders in an
# hour, checkout from outside India). Not an automatic decline; there is no payment gateway
# wired yet to decline anything, and refusing a legitimate buyer over a heuristic is its own
# kind of damage. Tune this to the business -- there is no universal number.
FRAUD_REVIEW_THRESHOLD = "200000"

# DEMO_MODE shows a banner saying the catalogue is sample data and no orders are fulfilled.
# Turned off at the owner's explicit request. NOTE: the catalogue in db/seed.sql is still
# placeholder stock and checkout still has no payment gateway wired (see README "Before
# taking real money") -- turning this off removes the disclaimer, it does not by itself
# make the shop truthful or able to take money. Replace the catalogue and wire Razorpay
# before actually announcing the site publicly.
DEMO_MODE = "false"

# Business details. These appear in your policies, footer and contact page. Every page that
# needs them reads from here, so fill them in once. Leaving a value blank shows a visible
# placeholder rather than silently omitting a legally required detail.
LEGAL_NAME = "Rarehaus"
REGISTERED_ADDRESS = "Bishnu Rabha Path, Guwahati, Assam 781026, India"
SUPPORT_EMAIL = "customer@rarehaus.in"
SUPPORT_WHATSAPP = "+91 93959 62006"
GSTIN = ""
CIN = ""
GRIEVANCE_OFFICER = "Rehan Hussain"
GRIEVANCE_EMAIL = "customer@rarehaus.in"
GRIEVANCE_PHONE = "+91 93959 62006"
JURISDICTION_CITY = "Guwahati"

# Policy windows shown on the returns and privacy pages. Reasonable, defensible defaults are
# set below -- change them if you want a different policy, but don't leave them blank, since
# an unset window is a compliance gap (Consumer Protection E-Commerce Rules expect a clear
# stated policy), not just a missing detail.
DAMAGE_REPORT_WINDOW = "48 hours"
REFUND_TIMEFRAME = "7 working days"
DATA_RETENTION_PERIOD = "8 years"
PRIVACY_REQUEST_TIMEFRAME = "30 days"

# Buyer sign-in (Clerk) and welcome email (Resend). The publishable key is not secret --
# it is sent to the browser so clerk-js can load -- so it lives here; the secret key,
# webhook signing secret and Resend API key below do not and must be set with
# `wrangler secret put`. Checkout still works as a guest without any of this configured:
# /account/sign-in shows a plain "not set up yet" page until CLERK_PUBLISHABLE_KEY and
# CLERK_SECRET_KEY are both set, and the welcome email is silently skipped until
# RESEND_API_KEY is set.
CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsucmFyZWhhdXMuaW4k"
RESEND_FROM = "Rarehaus <welcome@rarehaus.in>"

# Help chat, via Groq (a fast, free-tier OpenAI-compatible inference API -- console.groq.com).
# The chat bubble in the footer only renders when GROQ_API_KEY is set (see render.js), so
# leaving it unset just means no chat widget, nothing breaks.
GROQ_MODEL = "llama-3.3-70b-versatile"

# Secrets (set with `wrangler secret put <NAME>`, never commit them):
#   SESSION_SECRET        random string used to sign admin and cart cookies. Admin login is
#                         now per-employee (the admin_users table, see db/schema.sql and
#                         "Employees" in /admin) rather than a single shared password, so
#                         ADMIN_PASSWORD is no longer read by the app -- safe to leave set or
#                         to remove with `wrangler secret delete ADMIN_PASSWORD`.
#   CLERK_SECRET_KEY      from the Clerk dashboard, pairs with CLERK_PUBLISHABLE_KEY above
#   CLERK_WEBHOOK_SECRET  from the Clerk dashboard's Webhooks page, for the endpoint at
#                         /webhooks/clerk (subscribe it to the user.created event)
#   RESEND_API_KEY        from your Resend account, used to send the welcome email
#   GROQ_API_KEY          from console.groq.com -- turns the help chat bubble on
