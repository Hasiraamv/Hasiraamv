name = "fitpocket"
main = "src/index.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

# Custom domain routing (configure in Cloudflare dashboard once the zone is added):
# route = { pattern = "fitpocket.in/*", zone_name = "fitpocket.in" }
# route = { pattern = "api.fitpocket.in/*", zone_name = "fitpocket.in" }

[[d1_databases]]
binding = "DB"
database_name = "fitpocket-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
ENVIRONMENT = "development"

# Set the real secret with: wrangler secret put JWT_SECRET
